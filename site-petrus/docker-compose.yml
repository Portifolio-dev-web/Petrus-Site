services:
  web:
    container_name: petrus-site-app-dev
    build:
      context: .
      dockerfile: Dockerfile
      # Diz ao Docker para parar na etapa de desenvolvimento do seu Dockerfile
      target: development-dependencies-env 
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=development
      # Variável útil no Windows para garantir que o hot-reload funcione corretamente
      - CHOKIDAR_USEPOLLING=true 
    volumes:
      # Espelha o código da sua máquina para dentro do container
      - .:/app
      # Protege a pasta node_modules do container para não ser sobrescrita pelo seu Windows
      - /app/node_modules
    # Comando para iniciar o servidor de desenvolvimento (ajuste para "npm run dev" se usar Vite)
    command: npm start